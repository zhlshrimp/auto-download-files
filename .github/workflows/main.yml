name: Download and Commit File

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'  # 每小时运行一次（可修改）
  workflow_dispatch:     # 允许手动触发

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整 Git 历史

      - name: Download File 1
        run: |
          mkdir -p files  # 确保目录存在
          wget "https://sub.9426198.xyz/946946?b64" -O "files/b66.txt"
          # 或用 curl：
          # curl -o "files/file1-latest.zip" "https://example.com/file1.zip"

      - name: Download File 2
        run: |
          wget "https://sub1.9426198.xyz/946946?b64" -O "files/b66-1.txt"
          # curl -o "files/file2-latest.csv" "https://example.com/file2.csv"
          
      - name: Download File 3
        run: |
          wget "https://sub2.9426198.xyz/946946?b64" -O "files/b66-2.txt"
          # curl -o "files/file2-latest.csv" "https://example.com/file2.csv"
          
      - name: Get file sizes
        id: file_sizes
        run: |
          # 获取文件大小（人类可读格式）
          FILE1_SIZE=$(du -h "files/b66.txt" | cut -f1)
          FILE2_SIZE=$(du -h "files/b66-1.txt" | cut -f1)
          FILE3_SIZE=$(du -h "files/b66-2.txt" | cut -f1)
          
          # 保存到环境变量
          echo "FILE1_SIZE=$FILE1_SIZE" >> $GITHUB_ENV
          echo "FILE2_SIZE=$FILE2_SIZE" >> $GITHUB_ENV
          echo "FILE3_SIZE=$FILE2_SIZE" >> $GITHUB_ENV

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "bot@noreply.github.com"
          git add files/  # 添加所有 files/ 下的文件
          git commit -m "Update files: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          
# 步骤 3：发送 Telegram 通知
      - name: Notify Telegram
        run: |
          # 构造消息内容
          MESSAGE="✅ GitHub Actions 任务完成！%0A"
          MESSAGE+="📂 文件已更新：%0A"
                    # 添加文件1信息
          MESSAGE+="%0A%0A📦 *文件1*:"
          MESSAGE+="%0A- 名称: b66.txt"
          MESSAGE+="%0A- 大小: ${{ env.FILE1_SIZE }}"
          MESSAGE+="%0A- 下载: [原始文件](https://raw.githubusercontent.com/${{ github.repository }}/main/files/b66.txt)"
          
          # 添加文件2信息
          MESSAGE+="%0A%0A📊 *文件2*:"
          MESSAGE+="%0A- 名称: b66-1.txt"
          MESSAGE+="%0A- 大小: ${{ env.FILE2_SIZE }}"
          MESSAGE+="%0A- 下载: [原始文件](https://raw.githubusercontent.com/${{ github.repository }}/main/files/b66-1.txt)"
          
          # 添加文件3信息
          MESSAGE+="%0A%0A📊 *文件3*:"
          MESSAGE+="%0A- 名称: b66-2.txt"
          MESSAGE+="%0A- 大小: ${{ env.FILE2_SIZE }}"
          MESSAGE+="%0A- 下载: [原始文件](https://raw.githubusercontent.com/${{ github.repository }}/main/files/b66-2.txt)"
          MESSAGE+="📅 时间: $(date +'%Y-%m-%d %H:%M:%S')"

          # 发送消息到 Telegram
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
